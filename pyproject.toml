[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "docsentinel"
version = "4.2.0"
description = "Automated security assessment for documents and questionnaires"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "Arthur Pan", email = "panchao@example.com"}
]
keywords = ["security", "llm", "assessment", "rag"]
dependencies = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "pydantic",
    "pydantic-settings",
    "openai",
    "httpx",
    "numpy<3",
    "chromadb",
    "sentence-transformers>=6.2.0",
    "langchain-core>=1.7.3",
    "langchain-openai>=1.7.3",
    "langchain-anthropic>=1.7.7",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.19",
    "langchain-chroma>=1.1.0",
    "langchain-huggingface>=1.2.3",
    "python-docx",
    "openpyxl",
    "pymupdf",
    "PyPDF2",
    "python-pptx",
    "reportlab",
    "aiofiles",
    "moviepy",
    "mcp",
    "a2a-sdk[fastapi]==1.3.0",
    "docling>=2.145.0",
    "lightrag-hku>=1.5.7",
    "sqlmodel>=0.0.48",
    "passlib[bcrypt]>=1.7.4",
    "PyJWT>=2.15.1",
    "alembic>=1.20.1",
    "pyyaml>=6.0.3"
]

[project.optional-dependencies]
governance-infra = [
    "redis>=8.1.0",
    "structlog>=26.1.0",
    "prometheus-fastapi-instrumentator>=8.1.0"
]

[project.scripts]
docsentinel-mcp = "app.mcp_server:mcp.run"

[project.urls]
"Homepage" = "https://github.com/arthurpanhku/DocSentinel"
"Bug Tracker" = "https://github.com/arthurpanhku/DocSentinel/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "evals*"]

# --- Tool Configuration ---

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
python_files = ["test_*.py"]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
